name: CPU tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu:
    name: Python 3.12 CPU regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ui.txt
            requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run targeted dataset and utility tests
        run: python -m pytest -rs -q tests/test_dataset.py tests/test_metadata_output_safety.py
      - name: Run full CPU test suite
        run: python -m pytest -rs -q